
name: Teste Microservices

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-auth-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        working-directory: ./burguer-app/auth-service
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip check

      - name: Rodar testes
        working-directory: ./burguer-app/auth-service
        run: |
          .venv/bin/python -m pytest -v --cov=models --cov=services --cov=config --cov=controllers
          .venv/bin/python -m radon cc ./models/user_model.py

